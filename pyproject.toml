[project]
name = "insurance-mas-rag"
version = "0.1.0"
description = "RAG chatbot for MAS Notice 125 and MAS Notice 133: answers questions from the notices with page and paragraph citations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
