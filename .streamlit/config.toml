# Fintech (Stripe-inspired): bright white, pale grey-blue cards, rich blurple accent, dark navy text
[theme]
base = "light"
backgroundColor = "#FFFFFF"            # white: main page
secondaryBackgroundColor = "#F6F9FC"   # pale grey-blue: chat box, expanders (look like cards)
primaryColor = "#635BFF"               # blurple: buttons, highlights
linkColor = "#635BFF"
borderColor = "#E3E8EE"                # soft grey-blue hairlines
textColor = "#0A2540"                  # dark navy

# Inter from Google Fonts (loaded by the viewer's browser), plain sans-serif if it can't load
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = [650, 600, 600, 600, 600, 600]
baseRadius = "0.5rem"                  # rounded cards and inputs
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#F6F9FC"            # pale grey-blue
secondaryBackgroundColor = "#FFFFFF"   # "New conversation" button
textColor = "#0A2540"
borderColor = "#E3E8EE"
